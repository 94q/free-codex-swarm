[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-swarm"
version = "0.1.0"
description = "ChatGPT-authenticated Codex collaboration in a Windows terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["textual>=8.2,<9", "rich>=14.2,<16", "jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.17,<1"]

[project.scripts]
codex-swarm = "codex_swarm.__main__:main"

[tool.setuptools.packages.find]
include = ["codex_swarm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

